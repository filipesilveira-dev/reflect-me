<main>
    <div class="flex">
      <div class="hidden md:flex flex-col justify-center items-center ">
        <img src="/reflectMeLogo.png" alt="Logo Reflect Me" class="h-20" />
        <h1 class="text-3xl text-text-primary">Reflect Me</h1>
        <p class="text-xs text-text-primary">Um espaço para reflexões guiadas.</p>
      </div>
        <section
      [style.background-image]="'url(/loginBackground.png)'"
      class="flex flex-col gap-8 justify-center items-center h-screen w-full bg-cover bg-center bg-no-repeat"
        >
      <div class="flex flex-col justify-center items-center md:hidden">
        <img src="/reflectMeLogo.png" alt="Logo Reflect Me" class="h-20" />
        <h1 class="text-3xl text-text-primary">Reflect Me</h1>
        <p class="text-xs text-text-primary">Um espaço para reflexões guiadas.</p>
      </div>
      <div class="flex flex-col h-90 mx-8 p-4 gap-3 bg-white rounded-md shadow-xs">
        <div>
          <h2 class="font-bold">Bem-vindo(a)!</h2>
          <p class="text-xs text-text-primary">Acesse sua conta para continuar</p>
        </div>
        <form (submit)="onSubmit($event)" class="flex flex-col gap-4">
          <input
            type="text"
            placeholder="Usuário"
            name="username"
            class="bg-bg-input p-2 text-text-primary rounded-md outline-none focus:border-text-primary hover:border-2 border-text-primary"
          />
          <input
            type="password"
            placeholder="Senha"
            name="password"
            class="bg-bg-input p-2 text-text-primary rounded-md outline-none focus:border-text-primary  hover:border-2 border-text-primary"
          />
          <button type="submit" class="w-full bg-bg-button-primary p-2 text-white rounded-md cursor-pointer hover:bg-bg-button-hover">
            Entrar
          </button>
        </form>
        <p class="text-xs bg-bg-primary p-2 text-text-primary rounded-md">
          Para acessar a página do profissional, utilize <strong>"admin"</strong> e <strong>senha: 123"</strong>, e para acessar a
          página do usuário, utilize <strong>"user"</strong> e senha: "123".
        </p>
      </div>
        </section>
    </div>
</main>
