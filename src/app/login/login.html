<main>
  <div class="flex">
    <div
      [style.background-image]="'url(/loginBackground.png)'"
      class="hidden md:flex flex-col justify-center items-center bg-cover bg-center bg-no-repeat w-200"
    >
      <img src="/reflectMeLogoTrans.png" alt="Logo Reflect Me" class="h-20 md:h-40" />
      <h1 class="m-2 text-5xl text-text-primary ">Reflect Me</h1>
      <p class="text-md text-text-primary ">Um espaço para reflexões guiadas.</p>
    </div>

    <section
      class="bg-login flex flex-col gap-8 justify-center items-center h-screen w-full bg-cover bg-center bg-no-repeat md:bg-white"
    >
      <div class="flex flex-col justify-center items-center md:hidden">
        <img src="/reflectMeLogoTrans.png" alt="Logo Reflect Me" class="h-20" />
        <h1 class="text-3xl text-text-primary ">Reflect Me</h1>
        <p class="text-xs text-text-primary">Um espaço para reflexões guiadas.</p>
      </div>

      <div
        class="flex flex-col h-90 mx-8 p-4 gap-3 bg-white rounded-md shadow-xs max-w-90 md:shadow-none w-full md:gap-8"
      >
        <div class="flex flex-col md:items-center">
          <h2 class="font-bold md:text-4xl">Bem-vindo(a)!</h2>
          <p class="text-xs md:text-lg text-text-primary">Acesse sua conta para continuar</p>
        </div>

        <form (submit)="onSubmit($event)" class="flex flex-col gap-4">
          <input
            type="text"
            placeholder="Usuário"
            name="username"
            class="bg-bg-input p-2 text-text-primary rounded-md outline-none focus:border-text-primary hover:border border-text-primary"
          />
          <input
            type="password"
            placeholder="Senha"
            name="password"
            class="bg-bg-input p-2 text-text-primary rounded-md outline-none focus:border-text-primary hover:border border-text-primary"
          />
          <button
            type="submit"
            class="w-full bg-bg-button-primary p-2 text-white rounded-md cursor-pointer hover:bg-bg-button-hover"
          >
            Entrar
          </button>
        </form>
        <p class="text-xs bg-bg-primary p-2 text-text-primary rounded-md">
          Para acessar a página do profissional, utilize <strong>"admin"</strong> e
          <strong>senha: 123"</strong>, e para acessar a página do usuário, utilize
          <strong>"user"</strong> e senha: "123".
        </p>
      </div>
    </section>
  </div>
</main>
